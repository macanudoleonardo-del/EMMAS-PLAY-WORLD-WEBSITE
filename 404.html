<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Emma's Play World</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l4 9 10 .8-7.6 6.4 2.4 9.8L16 22.6 7.2 28l2.4-9.8L2 11.8 12 11z' fill='%23FF3EA5'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3A1440;
    background:linear-gradient(150deg,#FFF3FA,#FBE7F4 60%,#FFE9C7)}
  .card{max-width:460px;text-align:center;background:#fff;border:1px solid #F4DCEC;
    border-radius:28px;padding:40px 32px;box-shadow:0 20px 54px rgba(122,30,90,.18)}
  .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block}
  .oops{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;
    font-size:2.6rem;line-height:1.1;color:#FF3EA5;margin:.4rem 0}
  p{color:#7A5E77;font-size:1.05rem;line-height:1.55;margin:.5rem 0}
  .es{font-size:.95rem;opacity:.85}
  a.btn{display:inline-block;margin-top:20px;padding:14px 28px;border-radius:999px;
    background:#FF3EA5;color:#fff;font-weight:700;text-decoration:none;
    box-shadow:0 6px 20px rgba(255,62,165,.35)}
  a.btn:hover{transform:translateY(-2px)}
  a.btn{transition:transform .2s}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/images/logo.jpg" alt="Emma's Play World" onerror="this.remove()">
    <div class="oops">Oops! 🌈</div>
    <p>This page went off to play somewhere else.</p>
    <p class="es">¡Esta página se fue a jugar a otro lado!</p>
    <a class="btn" href="/">← Back to Emma's Play World 💗</a>
  </div>
</body>
</html>
